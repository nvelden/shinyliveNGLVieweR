<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>shinyliveNGLVieweR</title>
    <link rel="icon" href="./favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png" />
    <script
      src="./shinylive/load-shinylive-sw.js"
      type="module"
    ></script>
    <script type="module">
      import { runExportedApp } from "./shinylive/shinylive.js";
      runExportedApp({
        id: "root",
        appEngine: "r",
        relPath: "",
      });
    </script>
    <link rel="stylesheet" href="./shinylive/style-resets.css" />
    <link rel="stylesheet" href="./shinylive/shinylive.css" />
    <style>
      #first-visit-note {
        position: fixed;
        bottom: 32px;
        left: 50%;
        transform: translateX(-50%);
        color: #888;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 14px;
        line-height: 1.5;
        text-align: center;
        z-index: 10;
        pointer-events: none;
        max-width: 480px;
        padding: 0 20px;
      }
      #first-visit-note small { color: #aaa; font-size: 12px; }
      /* Hide once the Shiny app iframe is attached. */
      body:has(iframe) #first-visit-note { display: none; }
    </style>
  </head>
  <body>
    <div style="height: 100vh; width: 100vw" id="root"></div>
    <div id="first-visit-note">
      First visit warms up an R runtime in your browser — about a minute. <br />
      <small>Reloads are fast after that. No data leaves your machine.</small>
    </div>
  </body>
</html>
